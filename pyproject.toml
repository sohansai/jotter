[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jotter"
version = "0.5.0"
description = "Sticky notes that stay in your terminal"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Jotter Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "platformdirs>=4.2.0"
]

[project.scripts]
jotter = "jotter.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/jotter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=jotter --cov-report=term-missing"
